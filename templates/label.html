<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Label — {{ item.identifier }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      background: #e5e7eb;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      gap: 16px;
      min-height: 100vh;
    }

    /* Preview = the actual PNG, scaled to fill screen width */
    .preview-wrap {
      width: 100%;
      max-width: 360px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 14px rgba(0,0,0,0.13);
      background: #fff;
      position: relative;
      min-height: 60px;
    }
    .preview-wrap img {
      width: 100%;
      height: auto;
      display: block;
    }
    .preview-loading {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #fff; font-size: 13px; color: #9ca3af;
    }

    .controls {
      background: #fff;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 14px 16px;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .controls h3 {
      font-size: 12px; font-weight: 700; color: #6b7280;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .ctrl-row { display: flex; align-items: center; gap: 10px; }
    .ctrl-row label { font-size: 14px; color: #374151; width: 95px; flex-shrink: 0; }
    .ctrl-row input[type=range] { flex: 1; accent-color: #1F5C99; }
    .ctrl-val { font-size: 13px; color: #6b7280; width: 38px; text-align: right; flex-shrink: 0; }

    .print-bar { display: flex; gap: 12px; width: 100%; max-width: 360px; }
    .btn {
      padding: 15px 0; border-radius: 12px; font-size: 17px;
      font-weight: 700; cursor: pointer; border: none;
      font-family: inherit; flex: 1; text-align: center;
      text-decoration: none; display: flex; align-items: center; justify-content: center;
    }
    .btn-print { background: #1F5C99; color: #fff; }
    .btn-back  { background: #d1d5db; color: #374151; }
    .btn:disabled { opacity: 0.6; }
  </style>
</head>
<body>

  <div class="preview-wrap" id="preview-wrap">
    <img id="preview-img" src="" alt="Label preview" />
    <div class="preview-loading" id="preview-loading">Loading…</div>
  </div>

  <div class="controls">
    <h3>Adjust Label</h3>
    <div class="ctrl-row">
      <label>Height</label>
      <input type="range" id="s-height" min="15" max="60" value="22" step="1" />
      <span class="ctrl-val" id="v-height">22mm</span>
    </div>
    <div class="ctrl-row">
      <label>QR Size</label>
      <input type="range" id="s-qr" min="8" max="50" value="18" step="1" />
      <span class="ctrl-val" id="v-qr">18mm</span>
    </div>
    <div class="ctrl-row">
      <label>Name Size</label>
      <input type="range" id="s-name" min="2" max="12" value="4" step="0.5" />
      <span class="ctrl-val" id="v-name">4mm</span>
    </div>
    <div class="ctrl-row">
      <label>Location Size</label>
      <input type="range" id="s-loc" min="2" max="10" value="4" step="0.5" />
      <span class="ctrl-val" id="v-loc">4mm</span>
    </div>
    <div class="ctrl-row">
      <label>ID Size</label>
      <input type="range" id="s-id" min="2" max="8" value="3.5" step="0.5" />
      <span class="ctrl-val" id="v-id">3.5mm</span>
    </div>
  </div>

  <div class="print-bar">
    <button class="btn btn-print" id="btn-print">
      <span id="btn-label">Save to Photos</span>
    </button>
    <a class="btn btn-back" href="/item?id={{ item.identifier | urlencode }}&tab={{ item.tab | urlencode }}">Back</a>
  </div>

  <script>
    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    if (!isMobile) document.getElementById('btn-label').textContent = 'Open in Preview';

    let heightMm = 22, qrMm = 18, nameMm = 4, locMm = 4, idMm = 3.5;
    let debounceTimer = null;

    function imageUrl() {
      return `/label-image/{{ item.tab | urlencode }}/{{ item.identifier | urlencode }}.png?h=${heightMm}&qr=${qrMm}&fn=${nameMm}&fl=${locMm}&fi=${idMm}`;
    }

    function refreshPreview() {
      const img     = document.getElementById('preview-img');
      const loading = document.getElementById('preview-loading');
      loading.style.display = 'flex';
      const url = imageUrl() + '&_=' + Date.now();
      const tmp = new Image();
      tmp.onload = () => {
        img.src = url;
        loading.style.display = 'none';
      };
      tmp.onerror = () => { loading.textContent = 'Preview failed'; };
      tmp.src = url;
    }

    function scheduleRefresh() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(refreshPreview, 300);
    }

    function wire(id, valId, unit, onChange) {
      const s = document.getElementById(id);
      const v = document.getElementById(valId);
      s.addEventListener('input', () => {
        v.textContent = s.value + unit;
        onChange(parseFloat(s.value));
        scheduleRefresh();
      });
    }

    wire('s-height', 'v-height', 'mm', v => heightMm = v);
    wire('s-qr',     'v-qr',     'mm', v => qrMm     = v);
    wire('s-name',   'v-name',   'mm', v => nameMm   = v);
    wire('s-loc',    'v-loc',    'mm', v => locMm     = v);
    wire('s-id',     'v-id',     'mm', v => idMm      = v);

    // Load initial preview
    window.addEventListener('load', refreshPreview);

    document.getElementById('btn-print').addEventListener('click', async () => {
      if (!isMobile) {
        const a = document.createElement('a');
        a.href = imageUrl();
        a.download = 'label-{{ item.identifier }}.png';
        a.click();
        return;
      }

      const btn = document.getElementById('btn-print');
      btn.disabled = true;
      document.getElementById('btn-label').textContent = 'Preparing…';

      try {
        const resp = await fetch(imageUrl());
        const blob = await resp.blob();
        const file = new File([blob], 'label-{{ item.identifier }}.png', { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: 'Label {{ item.identifier }}' });
        } else {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = file.name;
          a.click();
        }
      } catch (e) {
        if (e.name !== 'AbortError') alert('Could not share: ' + e.message);
      } finally {
        btn.disabled = false;
        document.getElementById('btn-label').textContent = 'Save to Photos';
      }
    });
  </script>

</body>
</html>
