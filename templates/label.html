<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Label — {{ item.identifier }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    @page { size: 62mm 22mm; margin: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .label {
      width: 62mm;
      height: 22mm;
      padding: 1.5mm 2mm;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 2mm;
      overflow: hidden;
      background: #fff;
      transform-origin: top left;
    }

    .qr-wrap { flex-shrink: 0; }
    .qr-wrap img { width: 18mm; height: 18mm; display: block; }

    .label-text {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.8mm;
      min-width: 0;
    }
    .label-name     { font-size: 4mm;   font-weight: 800; color: #000; line-height: 1.15; word-break: break-word; }
    .label-location { font-size: 4mm;   font-weight: 700; color: #000; }
    .label-id       { font-size: 3.5mm; font-style: italic; color: #555; }

    @media screen {
      body {
        background: #e5e7eb;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 24px 16px;
        gap: 16px;
        min-height: 100vh;
      }
      .label-outer {
        width: 100%;
        max-width: 360px;
        position: relative;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 2px 14px rgba(0,0,0,0.13);
      }
      .label { position: absolute; top: 0; left: 0; }

      .controls {
        background: #fff;
        border: 1px solid #d1d5db;
        border-radius: 12px;
        padding: 14px 16px;
        width: 100%;
        max-width: 360px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .controls h3 {
        font-size: 12px; font-weight: 700; color: #6b7280;
        text-transform: uppercase; letter-spacing: 0.5px;
      }
      .ctrl-row { display: flex; align-items: center; gap: 10px; }
      .ctrl-row label { font-size: 14px; color: #374151; width: 95px; flex-shrink: 0; }
      .ctrl-row input[type=range] { flex: 1; accent-color: #1F5C99; }
      .ctrl-val { font-size: 13px; color: #6b7280; width: 38px; text-align: right; flex-shrink: 0; }

      .print-bar { display: flex; gap: 12px; width: 100%; max-width: 360px; }
      .btn {
        padding: 15px 0; border-radius: 12px; font-size: 17px;
        font-weight: 700; cursor: pointer; border: none;
        font-family: inherit; flex: 1; text-align: center;
        text-decoration: none; display: flex; align-items: center; justify-content: center;
      }
      .btn-print { background: #1F5C99; color: #fff; }
      .btn-back  { background: #e5e7eb; color: #374151; }
    }

    @media print {
      .controls, .print-bar { display: none !important; }
      .label-outer { border: none; border-radius: 0; box-shadow: none; }
      .label { position: static; transform: none !important; }
      body { background: #fff; padding: 0; }
    }
  </style>
</head>
<body>

  <div class="label-outer" id="label-outer">
    <div class="label" id="label">
      <div class="qr-wrap">
        <img id="qr-img" src="/qr/{{ item.tab | urlencode }}/{{ item.identifier | urlencode }}.png" alt="QR" />
      </div>
      <div class="label-text">
        {% if f.part_name %}<div class="label-name" id="t-name">{{ f.part_name }}</div>{% endif %}
        {% if f.location_code %}<div class="label-location" id="t-loc">{{ f.location_code }}</div>{% endif %}
        <div class="label-id" id="t-id">{{ item.identifier }}</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <h3>Adjust Label</h3>
    <div class="ctrl-row">
      <label>Height</label>
      <input type="range" id="s-height" min="15" max="60" value="22" step="1" />
      <span class="ctrl-val" id="v-height">22mm</span>
    </div>
    <div class="ctrl-row">
      <label>QR Size</label>
      <input type="range" id="s-qr" min="8" max="50" value="18" step="1" />
      <span class="ctrl-val" id="v-qr">18mm</span>
    </div>
    <div class="ctrl-row">
      <label>Name Size</label>
      <input type="range" id="s-name" min="2" max="12" value="4" step="0.5" />
      <span class="ctrl-val" id="v-name">4mm</span>
    </div>
    <div class="ctrl-row">
      <label>Location Size</label>
      <input type="range" id="s-loc" min="2" max="10" value="4" step="0.5" />
      <span class="ctrl-val" id="v-loc">4mm</span>
    </div>
    <div class="ctrl-row">
      <label>ID Size</label>
      <input type="range" id="s-id" min="2" max="8" value="3.5" step="0.5" />
      <span class="ctrl-val" id="v-id">3.5mm</span>
    </div>
  </div>

  <div class="print-bar">
    <button class="btn btn-print" id="btn-print">
      <span id="btn-label">Save to Photos</span>
    </button>
    <a class="btn btn-back" href="/item?id={{ item.identifier | urlencode }}&tab={{ item.tab | urlencode }}">Back</a>
  </div>

  <script>
    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    if (!isMobile) document.getElementById('btn-label').textContent = 'Open in Preview';

    const MM    = 96 / 25.4;
    const label = document.getElementById('label');
    const outer = document.getElementById('label-outer');

    let heightMm = 22, qrMm = 18, nameMm = 4, locMm = 4, idMm = 3.5;

    function rescale() {
      const scale = outer.offsetWidth / (62 * MM);
      label.style.width  = (62 * MM) + 'px';
      label.style.height = (heightMm * MM) + 'px';
      label.style.transform = `scale(${scale})`;
      outer.style.height = (heightMm * MM * scale) + 'px';
    }

    function updatePageCss(h) {
      let el = document.getElementById('dp');
      if (!el) { el = document.createElement('style'); el.id = 'dp'; document.head.appendChild(el); }
      el.textContent = `@page { size: 62mm ${h}mm; margin: 0; }`;
    }

    function wire(id, valId, unit, onChange) {
      const s = document.getElementById(id);
      const v = document.getElementById(valId);
      s.addEventListener('input', () => {
        v.textContent = s.value + unit;
        onChange(parseFloat(s.value));
      });
    }

    wire('s-height', 'v-height', 'mm', v => { heightMm = v; updatePageCss(v); rescale(); });
    wire('s-qr',     'v-qr',     'mm', v => {
      qrMm = v;
      const img = document.getElementById('qr-img');
      img.style.width = img.style.height = (v * MM) + 'px';
    });
    wire('s-name', 'v-name', 'mm', v => {
      nameMm = v;
      const el = document.getElementById('t-name');
      if (el) el.style.fontSize = (v * MM) + 'px';
    });
    wire('s-loc', 'v-loc', 'mm', v => {
      locMm = v;
      const el = document.getElementById('t-loc');
      if (el) el.style.fontSize = (v * MM) + 'px';
    });
    wire('s-id', 'v-id', 'mm', v => {
      idMm = v;
      const el = document.getElementById('t-id');
      if (el) el.style.fontSize = (v * MM) + 'px';
    });

    window.addEventListener('load', rescale);
    window.addEventListener('resize', rescale);

    function imageUrl() {
      return `/label-image/{{ item.tab | urlencode }}/{{ item.identifier | urlencode }}.png?h=${heightMm}&qr=${qrMm}&fn=${nameMm}&fl=${locMm}&fi=${idMm}`;
    }

    document.getElementById('btn-print').addEventListener('click', async () => {
      if (!isMobile) {
        const a = document.createElement('a');
        a.href = imageUrl();
        a.download = 'label-{{ item.identifier }}.png';
        a.click();
        return;
      }

      const btn = document.getElementById('btn-print');
      btn.disabled = true;
      document.getElementById('btn-label').textContent = 'Preparing…';

      try {
        const resp = await fetch(imageUrl());
        const blob = await resp.blob();
        const file = new File([blob], 'label-{{ item.identifier }}.png', { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: 'Label {{ item.identifier }}' });
        } else {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = file.name;
          a.click();
        }
      } catch (e) {
        if (e.name !== 'AbortError') alert('Could not share: ' + e.message);
      } finally {
        btn.disabled = false;
        document.getElementById('btn-label').textContent = 'Save to Photos';
      }
    });
  </script>

</body>
</html>
