<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Label — {{ item.identifier }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --label-height: 40mm;
      --qr-size: 28mm;
      --font-name: 5mm;
      --font-loc: 4mm;
      --font-id: 3.5mm;
    }

    @page {
      size: 62mm var(--label-height);
      margin: 0;
    }

    html, body {
      width: 62mm;
      background: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .label {
      width: 62mm;
      height: var(--label-height);
      padding: 2mm 2mm;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 2mm;
      overflow: hidden;
    }

    /* ── QR code ── */
    .qr-wrap {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qr-wrap img {
      width: var(--qr-size);
      height: var(--qr-size);
      display: block;
    }

    /* ── Text block ── */
    .label-text {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1mm;
      min-width: 0;
    }
    .label-name {
      font-size: var(--font-name);
      font-weight: 800;
      color: #000;
      line-height: 1.2;
      word-break: break-word;
    }
    .label-location {
      font-size: var(--font-loc);
      font-weight: 700;
      color: #000;
      letter-spacing: 0.3px;
    }
    .label-id {
      font-size: var(--font-id);
      font-style: italic;
      color: #444;
    }

    /* ── Screen-only UI ── */
    @media screen {
      body {
        background: #e5e7eb;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        padding: 20px 16px;
        gap: 16px;
        width: 100%;
      }
      .label {
        background: #fff;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.12);
      }

      /* Controls panel */
      .controls {
        background: #fff;
        border: 1px solid #d1d5db;
        border-radius: 12px;
        padding: 16px;
        width: 100%;
        max-width: 320px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .controls h3 {
        font-size: 13px;
        font-weight: 700;
        color: #6b7280;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 2px;
      }
      .ctrl-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .ctrl-row label {
        font-size: 14px;
        color: #374151;
        width: 90px;
        flex-shrink: 0;
      }
      .ctrl-row input[type=range] {
        flex: 1;
        accent-color: #1F5C99;
      }
      .ctrl-val {
        font-size: 13px;
        color: #6b7280;
        width: 38px;
        text-align: right;
        flex-shrink: 0;
      }

      .print-bar {
        display: flex;
        gap: 10px;
        width: 100%;
        max-width: 320px;
      }
      .btn {
        padding: 14px 0;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        border: none;
        font-family: inherit;
        flex: 1;
      }
      .btn-print { background: #1F5C99; color: #fff; }
      .btn-back  { background: #e5e7eb; color: #374151; }
    }

    @media print {
      .print-bar, .controls { display: none !important; }
      body { background: #fff; padding: 0; width: 62mm; }
    }
  </style>
</head>
<body>

  <div class="label" id="label">
    <div class="qr-wrap">
      <img id="qr-img"
           src="/qr/{{ item.tab | urlencode }}/{{ item.identifier | urlencode }}.png"
           alt="QR code" />
    </div>
    <div class="label-text">
      {% if f.part_name %}
      <div class="label-name">{{ f.part_name }}</div>
      {% endif %}
      {% if f.location_code %}
      <div class="label-location">{{ f.location_code }}</div>
      {% endif %}
      <div class="label-id">{{ item.identifier }}</div>
    </div>
  </div>

  <div class="controls">
    <h3>Adjust Label</h3>

    <div class="ctrl-row">
      <label>Height</label>
      <input type="range" id="s-height" min="20" max="80" value="40" step="1" />
      <span class="ctrl-val" id="v-height">40mm</span>
    </div>

    <div class="ctrl-row">
      <label>QR Size</label>
      <input type="range" id="s-qr" min="10" max="55" value="28" step="1" />
      <span class="ctrl-val" id="v-qr">28mm</span>
    </div>

    <div class="ctrl-row">
      <label>Name Size</label>
      <input type="range" id="s-name" min="2" max="10" value="5" step="0.5" />
      <span class="ctrl-val" id="v-name">5mm</span>
    </div>

    <div class="ctrl-row">
      <label>Location Size</label>
      <input type="range" id="s-loc" min="2" max="8" value="4" step="0.5" />
      <span class="ctrl-val" id="v-loc">4mm</span>
    </div>

    <div class="ctrl-row">
      <label>ID Size</label>
      <input type="range" id="s-id" min="2" max="7" value="3.5" step="0.5" />
      <span class="ctrl-val" id="v-id">3.5mm</span>
    </div>
  </div>

  <div class="print-bar">
    <button class="btn btn-print" onclick="window.print()">Print Label</button>
    <button class="btn btn-back"  onclick="history.back()">Back</button>
  </div>

  <script>
    const root = document.documentElement;

    function wire(sliderId, valId, cssVar, unit) {
      const slider = document.getElementById(sliderId);
      const val    = document.getElementById(valId);
      slider.addEventListener('input', () => {
        const v = slider.value + unit;
        root.style.setProperty(cssVar, v);
        val.textContent = v;
        // also update @page size dynamically via a style element
        if (cssVar === '--label-height') updatePageSize(slider.value);
      });
    }

    function updatePageSize(mm) {
      let el = document.getElementById('dynamic-page');
      if (!el) { el = document.createElement('style'); el.id = 'dynamic-page'; document.head.appendChild(el); }
      el.textContent = `@page { size: 62mm ${mm}mm; margin: 0; }`;
    }

    wire('s-height', 'v-height', '--label-height', 'mm');
    wire('s-qr',     'v-qr',     '--qr-size',      'mm');
    wire('s-name',   'v-name',   '--font-name',     'mm');
    wire('s-loc',    'v-loc',    '--font-loc',      'mm');
    wire('s-id',     'v-id',     '--font-id',       'mm');

    // Auto-open print dialog on mobile
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      window.addEventListener('load', () => setTimeout(() => window.print(), 400));
    }
  </script>

</body>
</html>
